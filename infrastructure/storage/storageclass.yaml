# ceph-rbd is now the cluster default (flipped 2026-09-04, Phase 4 of the
# Ceph migration) -- local-path is unmanaged hand-applied drift, its
# is-default-class annotation is flipped to "false" via kubectl, not here.
# Kept installed for genuinely node-local scratch.
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
  name: ceph-rbd
provisioner: rbd.csi.ceph.com
parameters:
  clusterID: 00000000-0000-0000-0000-000000000000
  pool: k8s-rbd
  imageFeatures: layering
  csi.storage.k8s.io/fstype: ext4
  csi.storage.k8s.io/provisioner-secret-name: csi-rbd-secret
  csi.storage.k8s.io/provisioner-secret-namespace: ceph-csi
  csi.storage.k8s.io/controller-expand-secret-name: csi-rbd-secret
  csi.storage.k8s.io/controller-expand-secret-namespace: ceph-csi
  csi.storage.k8s.io/node-stage-secret-name: csi-rbd-secret
  csi.storage.k8s.io/node-stage-secret-namespace: ceph-csi
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate
