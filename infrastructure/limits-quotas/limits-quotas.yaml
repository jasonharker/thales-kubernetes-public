# kubecost. The LimitRange defaults are deliberately higher than the lemp/monitoring ones:
# several cost-analyzer containers declare requests but no limits, so they inherit the
# default, and the usual 512Mi default OOM-kills the cost-model on first ETL build.
apiVersion: v1
kind: LimitRange
metadata:
  name: kubecost-limitrange
  namespace: kubecost
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 1Gi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 4Gi
      # Floor is 10m/32Mi, not the 50m/64Mi used elsewhere in this file: cost-analyzer's
      # sidecars request 10m CPU and 55Mi, and the higher floor rejected every replica of
      # the main Deployment with FailedCreate while the release itself reported healthy.
      min:
        cpu: 10m
        memory: 32Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: kubecost-quota
  namespace: kubecost
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.cpu: "12"
    # 12Gi, not the 6Gi the aggregator bump alone needs: cost-analyzer rolls with
    # maxSurge 1, so a rollout stands up a second four-container pod and needs a
    # full duplicate of the steady-state limits or it is rejected and stalls.
    limits.memory: 12Gi
    pods: "10"
    persistentvolumeclaims: "5"
    services: "10"
    secrets: "20"
    configmaps: "20"
---
