# secrets bumped 25->35 2026-08-23: AlertManager could not create its
# web-config Secret with the quota sitting exactly at cap (L#57 --
# a quota at its limit fails silently, not loudly). Real headroom now,
# not just +1, matching flux-system-quota.
# limits.cpu bumped 16->20 2026-08-30: promtail DaemonSet pods carry no
# explicit resources, so each draws the monitoring-limitrange default
# (limits.cpu 500m) -- the 7th node's pod could not get that with the
# quota sitting exactly at cap. Real headroom now, not just +1.
# pods bumped 35->60 2026-09-03: the namespace was sitting at exactly 35/35,
# so nothing new could schedule at all -- the Ceph migration's copy Jobs and
# the Prometheus/Alertmanager StatefulSet recreates each need pod slots (L#57).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: monitoring-quota
  namespace: monitoring
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 10Gi
    limits.cpu: "20"
    limits.memory: 24Gi
    pods: "60"
    persistentvolumeclaims: "10"
    services: "30"
    secrets: "35"
    configmaps: "20"
---
