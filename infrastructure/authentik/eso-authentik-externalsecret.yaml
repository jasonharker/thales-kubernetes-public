# Replaces the SOPS secrets/ manifests. Target names and keys are unchanged; every
# property of the Vault key becomes a key of the Secret (dataFrom.extract).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-secrets
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-authentik
    kind: SecretStore
  target:
    name: authentik-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: authentik/authentik-secrets
