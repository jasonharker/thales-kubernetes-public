# Namespaced SecretStore, scoped to what the authentik Vault role/policy grants
# (secret/data/authentik/*). See infrastructure/external-secrets/.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-authentik
  namespace: authentik
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: authentik
          serviceAccountRef:
            name: eso-authentik
