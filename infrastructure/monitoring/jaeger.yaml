# Jaeger v2 all-in-one — distributed tracing for the monitoring stack (October 8, 2026).
#
# ⚠️ Pinned at X.Y.Z: X.Y.Z removed the v1 HTTP API (/api/traces, /api/services —
# jaeger#9260), and Grafana 12.4's Jaeger datasource still runs trace *search* against
# /api/traces (only trace-by-ID honours the jaegerEnableGrpcEndpoint toggle). Unpin once
# Grafana's search moves to /api/v3.
#
# Single replica, Badger on a ceph-rbd PVC (jaeger-pvc-rbd.yaml), 72h span TTL. RWO, so
# strategy: Recreate. In the nightly k8s-rbd-backup run; traces are disposable anyway.
#
# Ingest is OTLP only (4317 gRPC, 4318 HTTP). The first sender is Traefik
# (infrastructure/traefik/helmrelease.yaml → tracing.otlp.grpc); any new sender outside
# this namespace needs a rule in monitoring-allow-ingress (network-policies.yaml).
#
# ⚠️ Receiver endpoints are set to 0.0.0.0 explicitly: upstream defaults them to
# localhost, which would accept nothing from other pods. jaeger_query's own default is
# already the wildcard :16686.
#
# UI: jaeger.thales.internal (routes/jaeger.yaml, lan-only — Jaeger has no auth of its own).
# Grafana reads it as a datasource (grafana-datasources.yaml).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-config
  namespace: monitoring
data:
  config.yaml: |
    service:
      extensions: [jaeger_storage, jaeger_query]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [jaeger_storage_exporter]

    extensions:
      jaeger_query:
        storage:
          traces: badger_store
      jaeger_storage:
        backends:
          badger_store:
            badger:
              directories:
                keys: /badger/data
                values: /badger/data
              ephemeral: false
              ttl:
                spans: 72h

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:

    exporters:
      jaeger_storage_exporter:
        trace_storage: badger_store
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: monitoring
  annotations:
    configmap.reloader.stakater.com/reload: jaeger-config
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app: jaeger
    spec:
      securityContext:
        fsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: jaeger
          image: jaegertracing/jaeger
          args:
            - --config=/etc/jaeger/config.yaml
          ports:
            - name: ui
              containerPort: 16686
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            httpGet:
              path: /
              port: ui
          livenessProbe:
            httpGet:
              path: /
              port: ui
            initialDelaySeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/jaeger
              readOnly: true
            - name: data
              mountPath: /badger
      volumes:
        - name: config
          configMap:
            name: jaeger-config
        - name: data
          persistentVolumeClaim:
            claimName: jaeger-data-rbd
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: ui
      protocol: TCP
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP
