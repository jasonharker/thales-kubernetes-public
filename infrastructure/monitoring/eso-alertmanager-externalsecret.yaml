# Materializes the Discord webhook URL for the kube-prometheus-stack
# HelmRelease's spec.valuesFrom (see infrastructure/helm/kube-prometheus-stack.yaml).
# The URL never touches git — Vault is the only place it's written.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-discord-webhook
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-alertmanager
    kind: SecretStore
  target:
    name: alertmanager-discord-webhook
    creationPolicy: Owner
  data:
    - secretKey: webhook-url
      remoteRef:
        key: alertmanager/discord
        property: webhook-url
