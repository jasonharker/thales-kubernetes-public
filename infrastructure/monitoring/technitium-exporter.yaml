---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    secret.reloader.stakater.com/auto: "true"
  name: technitium-exporter
  namespace: monitoring
  labels:
    app: technitium-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: technitium-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: technitium-exporter
        app: technitium-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: json-exporter
          image: quay.io/prometheuscommunity/json-exporter
          args:
            - --config.file=/config/config.yml
          ports:
            - name: metrics
              containerPort: 7979
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: 7979
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              memory: "48Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "200m"
      volumes:
        - name: config
          secret:
            secretName: technitium-exporter-config
---
apiVersion: v1
kind: Service
metadata:
  name: technitium-exporter
  namespace: monitoring
  labels:
    app: technitium-exporter
spec:
  selector:
    app: technitium-exporter
  ports:
    - name: metrics
      port: 7979
      targetPort: metrics
---
# Multi-target pattern: one exporter, three Technitium nodes as probe targets.
# Cluster replication covers configuration, not statistics -- each node reports
# only its own traffic, so any fleet total is a sum across the three instances.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: technitium
  namespace: monitoring
  labels:
    release: prometheus  # must match the kube-prometheus-stack release label
spec:
  jobName: technitium
  interval: 60s
  scrapeTimeout: 10s
  module: technitium
  prober:
    url: technitium-exporter.monitoring.svc.cluster.local:7979
    path: /probe
  targets:
    staticConfig:
      static:
        - http://10.20.120.21:5380/api/dashboard/stats/get?type=LastHour
        - http://10.20.120.22:5380/api/dashboard/stats/get?type=LastHour
        - http://10.20.120.23:5380/api/dashboard/stats/get?type=LastHour
