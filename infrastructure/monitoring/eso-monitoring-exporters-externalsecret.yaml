# Replaces the SOPS secrets/ manifests. Target names and keys are unchanged; every
# property of the Vault key becomes a key of the Secret (dataFrom.extract).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: proxmox-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-monitoring-exporters
    kind: SecretStore
  target:
    name: proxmox-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: monitoring/proxmox-credentials
---
# json_exporter module config. The Technitium API token lives here rather than in
# the Probe targets, because Probe targets are plaintext in Git. Technitium accepts
# the token as an Authorization: Bearer header (verified 2026-08-08; X-Api-Token and
# no-header both return invalid-token).
#
# NOTE: these are ROLLING ONE-HOUR window values, not monotonic counters -- the
# Technitium API exposes no lifetime counter. Treat every series as a gauge; rate()
# is meaningless against them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: technitium-exporter-config
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-monitoring-exporters
    kind: SecretStore
  target:
    name: technitium-exporter-config
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: monitoring/technitium-exporter-config
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: snmp-exporter-config
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-monitoring-exporters
    kind: SecretStore
  target:
    name: snmp-exporter-config
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: monitoring/snmp-exporter-config
