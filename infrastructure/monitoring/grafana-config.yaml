---
apiVersion: v1
data:
  grafana.ini: '[server]

    protocol = http

    http_port = 3000

    domain = grafana.example.com

    root_url = https://grafana.example.com


    [security]

    admin_user = admin

    admin_password = admin123!

    cookie_secure = true

    cookie_samesite = lax


    [auth]

    disable_login_form = false

    oauth_auto_login = true

    oauth_allow_insecure_email_lookup = true


    [auth.generic_oauth]

    enabled = true

    name = Authentik

    allow_sign_up = true

    auto_login = true

    client_id = grafana-thales

    client_secret =REDACTED

    scopes = openid profile email

    auth_url = https://authentik.example.com/application/o/authorize/

    token_url = https://authentik.example.com/application/o/token/

    api_url = https://authentik.example.com/application/o/userinfo/

    login_attribute_path = preferred_username

    name_attribute_path = name

    role_attribute_path = contains(groups[*], `authentik Admins`) && `Admin` || `Viewer`

    role_attribute_strict = false


    [feature_toggles]

    jaegerEnableGrpcEndpoint = true


    [auth.anonymous]

    enabled = false


    [users]

    allow_sign_up = true

    auto_assign_org = true

    auto_assign_org_role = Admin


    [log]

    mode = console

    level = info

    '
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: monitoring
