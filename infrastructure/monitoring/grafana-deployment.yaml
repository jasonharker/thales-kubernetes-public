apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    secret.reloader.stakater.com/auto: "true"
  name: grafana
  namespace: monitoring
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: grafana
  # Recreate: the ceph-rbd PVC is RWO, so a surge pod on another node sits in
  # Multi-Attach forever (seen 2026-10-08 on a rollout restart).
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-03-12T17:01:09-07:00'
      labels:
        app.kubernetes.io/name: grafana
        app: grafana
    spec:
      containers:
      - env:
        - name: GF_INSTALL_PLUGINS
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: admin-password
              name: grafana-admin-credentials
        - name: GF_SECURITY_ADMIN_USER
          valueFrom:
            secretKeyRef:
              key: admin-user
              name: grafana-admin-credentials
        image: grafana/grafana
        imagePullPolicy: Always
        name: grafana
        ports:
        - containerPort: 3000
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: 3000
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        resources:
          limits:
            cpu: 200m
            memory: 388Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 472
          seccompProfile:
            type: RuntimeDefault
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/lib/grafana
          name: grafana-storage
        - mountPath: /etc/grafana/provisioning/datasources
          name: grafana-datasources
          readOnly: true
        - mountPath: /etc/grafana/grafana.ini
          name: grafana-config
          subPath: grafana.ini
        - mountPath: /etc/grafana/provisioning/dashboards
          name: grafana-dashboard-provider
          readOnly: true
        - mountPath: /etc/grafana/dashboards
          name: grafana-dashboards
          readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 472
        runAsNonRoot: true
        runAsUser: 472
      terminationGracePeriodSeconds: 30
      volumes:
      - name: grafana-storage
        persistentVolumeClaim:
          claimName: grafana-storage-rbd
      - configMap:
          defaultMode: 420
          name: grafana-datasources
          optional: true
        name: grafana-datasources
      - configMap:
          defaultMode: 420
          name: grafana-config
        name: grafana-config
      - configMap:
          defaultMode: 420
          name: grafana-dashboard-provider
        name: grafana-dashboard-provider
      - configMap:
          defaultMode: 420
          name: grafana-dashboards
        name: grafana-dashboards

