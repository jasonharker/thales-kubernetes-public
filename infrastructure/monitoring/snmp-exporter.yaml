# Service adopted into Flux August 21, 2026. Its Endpoints are NOT here:
# external-vms' are already in external-vms-endpoints.yaml, and snmp-exporter's
# are generated by Kubernetes from the selector. Only the Service was unmanaged.
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: snmp-exporter
  name: snmp-exporter
  namespace: monitoring
spec:
  ports:
  - name: metrics
    port: 9116
    protocol: TCP
    targetPort: 9116
  selector:
    app: snmp-exporter
  type: ClusterIP
