# Replaces grafana-admin-secret.yaml (SOPS). Target name/keys are unchanged so
# grafana-deployment.yaml needed no edits — see THALES-SSOT for the migration.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-grafana
    kind: SecretStore
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: grafana/admin
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: grafana/admin
        property: admin-password
