# Namespaced SecretStore, not a ClusterSecretStore — scopes this to what the
# grafana Vault role/policy grants (secret/data/grafana/*) and to this
# namespace's ExternalSecrets only. See infrastructure/external-secrets/.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-grafana
  namespace: monitoring
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: grafana
          serviceAccountRef:
            name: eso-grafana
