# Namespaced SecretStore, scoped to what the monitoring-exporters Vault role/policy grants
# (secret/data/monitoring/*). See infrastructure/external-secrets/.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-monitoring-exporters
  namespace: monitoring
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: monitoring-exporters
          serviceAccountRef:
            name: eso-monitoring-exporters
