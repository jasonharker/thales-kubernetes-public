# Namespaced SecretStore, not a ClusterSecretStore — scopes this to what the
# alertmanager Vault role/policy grants (secret/data/alertmanager/*) and to
# this namespace's ExternalSecrets only. Mirrors vault-grafana.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-alertmanager
  namespace: monitoring
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: alertmanager
          serviceAccountRef:
            name: eso-alertmanager
