# Policy 2. Same reasoning as restrict-privileged: narrows the namespace-wide PSA allowance
# for hostNetwork, hostPID and hostIPC to named workloads.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-host-namespaces
spec:
  validationActions:
    - Deny
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  autogen:
    podControllers:
      controllers:
        - deployments
        - daemonsets
        - statefulsets
        - jobs
        - cronjobs
  validations:
    - expression: >-
        !object.spec.?hostNetwork.orValue(false) &&
        !object.spec.?hostPID.orValue(false) &&
        !object.spec.?hostIPC.orValue(false)
      message: Host namespaces need a PolicyException in infrastructure/kyverno/policies/exceptions/.
