# local-path-provisioner is not managed by Flux, and it creates its helper pods from the
# local-path-config ConfigMap under its own ServiceAccount. Those pods use an untagged busybox
# image and have no limits, and local-path-storage has no LimitRange, so without this every
# local-path volume create and delete would be denied. See ceph-csi-nodeplugin.yaml for why
# this matches on ServiceAccount and reads both shapes.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: local-path-provisioner
  namespace: kyverno
spec:
  policyRefs:
    - name: disallow-latest-tag
      kind: ValidatingPolicy
    - name: require-memory-limits
      kind: ValidatingPolicy
  matchConditions:
    - name: local-path-provisioner-serviceaccount
      expression: >-
        object.metadata.namespace == 'local-path-storage' &&
        (object.kind == 'Pod' ? object.spec.serviceAccountName : object.spec.template.spec.serviceAccountName)
        == 'local-path-provisioner-service-account'
