# node-exporter reads host metrics, so it needs hostNetwork and hostPID. See
# ceph-csi-nodeplugin.yaml for why this matches on ServiceAccount and reads both shapes.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: node-exporter
  namespace: kyverno
spec:
  policyRefs:
    - name: restrict-host-namespaces
      kind: ValidatingPolicy
  matchConditions:
    - name: node-exporter-serviceaccount
      expression: >-
        object.metadata.namespace == 'monitoring' &&
        (object.kind == 'Pod' ? object.spec.serviceAccountName : object.spec.template.spec.serviceAccountName)
        == 'prometheus-prometheus-node-exporter'
