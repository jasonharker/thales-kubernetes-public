# Policy 7. Audit permanently. Job pods are skipped because a run-to-completion container has
# nothing for a probe to do. One probed container is enough: sidecars such as config reloaders
# have no health endpoint. Pods only, so each finding appears once.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-probes
spec:
  validationActions:
    - Audit
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  autogen:
    podControllers:
      controllers: []
  matchConditions:
    - name: not-a-job-pod
      expression: "!object.metadata.?ownerReferences.orValue([]).exists(o, o.kind == 'Job')"
  validations:
    - expression: object.spec.containers.exists(c, has(c.readinessProbe) || has(c.livenessProbe))
      message: At least one container should have a readiness or liveness probe.
