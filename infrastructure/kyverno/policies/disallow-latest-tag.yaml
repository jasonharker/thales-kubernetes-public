# Policy 4. An image must carry a digest or an explicit tag other than latest. The tag regex
# only looks after the last path segment, so 10.20.120.31:5000/app counts as untagged.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationActions:
    - Deny
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  autogen:
    podControllers:
      controllers:
        - deployments
        - daemonsets
        - statefulsets
        - jobs
        - cronjobs
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.allContainers.all(c, c.image.contains('@') ||
        (c.image.matches(':[^/:]+$') && !c.image.endsWith(':latest')))
      message: Images need an explicit tag other than latest, or a digest.
