# Policy 1. PSA already blocks privileged pods at baseline, but only per namespace: ceph-csi,
# guacamole, jenkins, local-path-storage and monitoring are all labelled enforce=privileged,
# so any new pod there could go privileged. This narrows that to named workloads through
# PolicyExceptions.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-privileged
spec:
  validationActions:
    - Deny
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  autogen:
    podControllers:
      controllers:
        - deployments
        - daemonsets
        - statefulsets
        - jobs
        - cronjobs
  variables:
    - name: allContainers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([]) +
        object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: variables.allContainers.all(c, !c.?securityContext.?privileged.orValue(false))
      message: Privileged containers need a PolicyException in infrastructure/kyverno/policies/exceptions/.
