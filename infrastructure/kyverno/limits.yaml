# Lower floor than the 50m/64Mi used elsewhere: the chart's init and hook containers request
# 10m CPU, and the LimitRange would reject them with an error that only shows on the
# ReplicaSet or Job. Quota leaves room for the post-upgrade and pre-delete hook Jobs.
---
apiVersion: v1
kind: LimitRange
metadata:
  name: kyverno-limitrange
  namespace: kyverno
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "1"
        memory: 512Mi
      min:
        cpu: 10m
        memory: 32Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: kyverno-quota
  namespace: kyverno
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "4"
    limits.memory: 3Gi
    pods: "8"
    services: "6"
    secrets: "20"
    configmaps: "10"
