# *.thales.internal wildcard, issued by THALES-Root-CA (gorgias) from a CSR generated on
# hippodamus; the key never left it except into Vault. Leaf only — the root is the
# direct issuer, so there is no chain to append. Renewal is manual: new CSR, sign on
# gorgias, `vault kv put secret/traefik/wildcard-tls`, and ESO + Traefik pick it up
# without a restart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wildcard-thales-local-tls
  namespace: traefik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-traefik
    kind: SecretStore
  target:
    name: wildcard-thales-local-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: traefik/wildcard-tls
        property: tls.crt
    - secretKey: tls.key
      remoteRef:
        key: traefik/wildcard-tls
        property: tls.key
