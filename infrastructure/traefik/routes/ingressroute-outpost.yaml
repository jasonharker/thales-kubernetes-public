# Authentik outpost callback. Must outrank every forward-auth-protected route or
# the auth flow redirect-loops (SSOT Authentik lesson #12). Deployed before any
# protected route is migrated, not alongside.
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik-outpost
  namespace: traefik
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/outpost.goauthentik.io`)
      kind: Rule
      priority: 100
      services:
        - name: authentik-server
          namespace: authentik
          port: 9000
