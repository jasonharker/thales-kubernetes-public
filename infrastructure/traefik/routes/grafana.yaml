# grafana.example.com — ported from /etc/traefik/dynamic/grafana.yml on CT 103.
#
# ⚠️ NEVER put authentik-forwardauth on Grafana. It has native OAuth2 against
# Authentik and the two together are a double-auth loop (SSOT §6).
#
# The LXC's copy of security-headers carried `sslRedirect: true`, which is not a
# Traefik v3 Headers option; it is dropped rather than ported. Cloudflare serves
# clients HTTPS regardless, so this changes nothing observable.
#
# The LXC also ran an active healthCheck against /api/health on each of its four
# hardcoded node addresses. Not reproduced: the backend here is a ClusterIP, so
# kubelet's own readiness probe already does that job.
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: traefik
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`grafana.example.com`) || Host(`grafana.thales.internal`)
      kind: Rule
      middlewares:
        - name: security-headers
          namespace: traefik
      services:
        - name: grafana
          namespace: monitoring
          port: 3000
