# Namespaced SecretStore, not a ClusterSecretStore — scopes this to what the
# traefik Vault role/policy grants (secret/data/traefik/*). See infrastructure/external-secrets/.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-traefik
  namespace: traefik
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: traefik
          serviceAccountRef:
            name: eso-traefik
