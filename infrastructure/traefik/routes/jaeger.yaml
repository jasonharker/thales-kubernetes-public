# jaeger.thales.internal — Jaeger UI, internal only.
#
# Same treatment as hubble: lan-only and nothing else. Jaeger ships with no
# authentication of its own, so the middleware is the only control.
#
# ⚠️ lan-only is ipAllowList 10.0.0.0/8 — every THALES VLAN — not a narrow allowlist.
#
# ⚠️ namespace: traefik on the middleware ref is required. A ref by name alone fails
# silently even with allowCrossNamespace.
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: jaeger
  namespace: traefik
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`jaeger.thales.internal`)
      kind: Rule
      middlewares:
        - name: lan-only
          namespace: traefik
      services:
        - name: jaeger
          namespace: monitoring
          port: 16686
