# Daily Raft snapshot. Auth is Kubernetes auth role `vault-snapshot` (policy: read on
# sys/storage/raft/snapshot), created by hand like the ESO roles.
# ponytail: snapshots sit on ceph-rbd, same failure domain as Ceph itself; move the PVC to
# an NFS PV on solon when that's reachable.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-snapshot
  namespace: vault
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vault-snapshots
  namespace: vault
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-snapshot
  namespace: vault
spec:
  schedule: "45 1 * * *" # after etcd-snapshot.sh at 01:30
  timeZone: America/Los_Angeles
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vault-snapshot
        spec:
          serviceAccountName: vault-snapshot
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: snapshot
              image: hashicorp/vault:X.Y.Z # same image as the server
              env:
                - name: VAULT_ADDR
                  value: http://vault-0.vault-internal:8200
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  export VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login role=vault-snapshot jwt=@/var/run/secrets/kubernetes.io/serviceaccount/token)
                  f=/snap/vault-$(date +%F).snap
                  vault operator raft snapshot save "$f"
                  test -s "$f"
                  find /snap -name 'vault-*.snap' -mtime +14 -delete
                  ls -l /snap
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m # namespace LimitRange minimum
                  memory: 64Mi
                limits:
                  memory: 128Mi
              volumeMounts:
                - name: snap
                  mountPath: /snap
          volumes:
            - name: snap
              persistentVolumeClaim:
                claimName: vault-snapshots
