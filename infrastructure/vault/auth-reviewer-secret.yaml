# Long-lived ServiceAccount token that Vault's Kubernetes auth method uses to call
# the TokenReview API (auth/kubernetes/config token_reviewer_jwt).
#
# The pod's own projected token at /var/run/secrets/kubernetes.io/serviceaccount/token
# MUST NOT be used for this. A projected token carries a bound object reference to the
# pod that mounted it, so it stops being valid the moment vault-0 is recreated, and
# every consumer login then fails with 403 until it is rewritten by hand.
#
# No data field here: the token controller populates .data from the annotation, and
# Flux never claims those fields under server-side apply.
#
# Writing the value into Vault stays a manual step, since a Job that could do it would
# itself need a Vault token. See the vault-kubernetes-auth-reviewer-jwt skill.
apiVersion: v1
kind: Secret
metadata:
  name: vault-auth-reviewer
  namespace: vault
  annotations:
    kubernetes.io/service-account.name: vault
type: kubernetes.io/service-account-token
