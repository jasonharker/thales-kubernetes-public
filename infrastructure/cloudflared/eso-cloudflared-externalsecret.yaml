# Replaces the SOPS secrets/ manifests. Target names and keys are unchanged; every
# property of the Vault key becomes a key of the Secret (dataFrom.extract).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-creds
  namespace: cloudflared
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-cloudflared
    kind: SecretStore
  target:
    name: cloudflared-creds
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: cloudflared/cloudflared-creds
