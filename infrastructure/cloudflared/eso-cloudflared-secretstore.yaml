# Namespaced SecretStore, scoped to what the cloudflared Vault role/policy grants
# (secret/data/cloudflared/*). See infrastructure/external-secrets/.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-cloudflared
  namespace: cloudflared
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: cloudflared
          serviceAccountRef:
            name: eso-cloudflared
