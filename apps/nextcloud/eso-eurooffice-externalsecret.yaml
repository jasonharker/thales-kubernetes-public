# Produces Secret `eurooffice-secret`, consumed by eurooffice.yaml. The same value
# is set in Nextcloud as the eurooffice app's `jwt_secret`.
#
# Kept separate from nextcloud-secret on purpose: if the Vault property is missing,
# only this ExternalSecret errors and only the eurooffice pod waits — nextcloud-secret
# keeps refreshing.
#
# ⚠️ Requires property EUROOFFICE_JWT_SECRET at secret/nextcloud/app (not
# Flux-managed): vault kv patch secret/nextcloud/app EUROOFFICE_JWT_SECRET="$(openssl rand -hex 32)"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eurooffice-secret
  namespace: nextcloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-nextcloud
    kind: SecretStore
  target:
    name: eurooffice-secret
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: nextcloud/app
        property: EUROOFFICE_JWT_SECRET
