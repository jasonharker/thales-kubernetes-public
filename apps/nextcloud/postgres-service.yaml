# Service name `postgres` is what nextcloud.yaml and db-backup.yaml dial as
# POSTGRES_HOST — inter-app addressing in this repo is by K8s service name.
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: nextcloud
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
