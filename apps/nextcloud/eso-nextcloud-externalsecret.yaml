# Produces Secret `nextcloud-secret`, consumed by postgres-deployment.yaml,
# nextcloud.yaml and db-backup.yaml.
#
# ⚠️ Requires a Vault KV entry at secret/nextcloud/app carrying all five properties,
# plus a kubernetes auth role `nextcloud` bound to ServiceAccount eso-nextcloud in
# namespace nextcloud. Neither is Flux-managed — create both BEFORE this reconciles,
# or every pod in the namespace sits unstarted waiting on a Secret that never appears.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-secret
  namespace: nextcloud
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-nextcloud
    kind: SecretStore
  target:
    name: nextcloud-secret
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_DB
      remoteRef:
        key: nextcloud/app
        property: POSTGRES_DB
    - secretKey: POSTGRES_USER
      remoteRef:
        key: nextcloud/app
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: nextcloud/app
        property: POSTGRES_PASSWORD
    - secretKey: NEXTCLOUD_ADMIN_USER
      remoteRef:
        key: nextcloud/app
        property: NEXTCLOUD_ADMIN_USER
    - secretKey: NEXTCLOUD_ADMIN_PASSWORD
      remoteRef:
        key: nextcloud/app
        property: NEXTCLOUD_ADMIN_PASSWORD
