# Namespaced SecretStore, not a ClusterSecretStore — scopes this to what the
# nextcloud Vault role/policy grants (secret/data/nextcloud/*) and to this
# namespace's ExternalSecrets only. Same shape as apps/guacamole's.
#
# This app is Vault/ESO from the start — no secrets/ directory and no SOPS, which
# is why its Flux Kustomization block carries no `decryption:` stanza.
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-nextcloud
  namespace: nextcloud
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: nextcloud
          serviceAccountRef:
            name: eso-nextcloud
