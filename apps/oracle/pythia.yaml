apiVersion: v1
kind: ConfigMap
metadata:
  name: pythia-code
  namespace: oracle
data:
  pythia.py: |
    """pythia -- the Oracle. Knative ksvc, scales to zero. Answers with a live fortune.

    ponytail: stdlib only, no framework -- one endpoint, no reason for one.
    """
    import os
    import random
    import sys
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    WOKE_AT = time.monotonic()

    TEMPLATES = [
        "The Oracle stirs on {node}, vessel {pod}, roused {age}s ago from a sleep of "
        "unknown length.\n  “Know thyself — but first know thy node.”",
        "Smoke rises at {node}. This vessel, {pod}, was nothing {age}s ago and will be "
        "nothing again within the minute.\n  “That which scales to zero cannot be "
        "said to have been.”",
        "{pod} speaks from {node}, drawn from the void {age}s past.\n  “The "
        "activator remembers what the pod forgets.”",
        "A voice answers from {node} — vessel {pod}, {age}s awake.\n  “Ask "
        "again and a different mouth will answer; the node forgets, the request does "
        "not.”",
    ]


    def fortune(node: str, pod: str, age_s: float) -> str:
        """Pick a template, fill it with live facts. Pure function -- selftest below."""
        t = random.choice(TEMPLATES)
        return t.format(node=node, pod=pod, age=f"{age_s:.1f}")


    def render_page() -> str:
        node = os.environ.get("NODE_NAME", "unknown-node")
        pod = os.environ.get("POD_NAME", "unknown-pod")
        age = time.monotonic() - WOKE_AT
        body = fortune(node, pod, age).replace("\n", "<br>")
        return (
            "<!doctype html><meta charset=utf-8><title>pythia</title>"
            "<body style='font-family:serif;background:#111;color:#eee;"
            "max-width:40em;margin:4em auto;padding:1em;line-height:1.6'>"
            f"<p>{body}</p></body>"
        )


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):  # noqa: N802 -- stdlib method name
            # ponytail: the Oracle "considers" -- a response this fast (sub-ms) never
            # overlaps another one, so a concurrent burst never registers as concurrent
            # to the autoscaler (target=1, sampled over a several-second window). This
            # delay is load-bearing for the demo, not decoration.
            time.sleep(random.uniform(0.3, 0.6))
            page = render_page().encode()
            self.send_response(200)
            self.send_header("Content-Type", "text/html; charset=utf-8")
            self.send_header("Content-Length", str(len(page)))
            self.send_header("Access-Control-Allow-Origin", "*")  # hestia's load-test button
            self.end_headers()
            self.wfile.write(page)

        def log_message(self, fmt, *args):  # quiet -- queue-proxy already logs access
            pass


    def selftest():
        out = fortune("anaximander-w3", "pythia-00007-x9k2q", 3.7)
        assert "anaximander-w3" in out
        assert "pythia-00007-x9k2q" in out
        assert "3.7" in out
        # every template must consume node/pod/age with no leftover braces
        for tmpl in TEMPLATES:
            rendered = tmpl.format(node="n", pod="p", age="1.0")
            assert "{" not in rendered and "}" not in rendered
        print("pythia selftest OK")


    if __name__ == "__main__":
        if "--selftest" in sys.argv:
            selftest()
            sys.exit(0)
        ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: pythia
  namespace: oracle
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pythia
      annotations:
        # target: "1" -- ~1 concurrent request per pod, so a burst of concurrent
        # requests scales out pods instead of queueing on one. max-scale caps a
        # runaway burst; there is no min-scale, so it still scales to zero at rest.
        autoscaling.knative.dev/target: "1"
        autoscaling.knative.dev/max-scale: "8"
    spec:
      containers:
        - image: python
          command: ["python3", "/app/pythia.py"]
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: code
          configMap:
            name: pythia-code
