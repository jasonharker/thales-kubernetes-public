# Replaces the SOPS secrets/ manifests. Target names and keys are unchanged; every
# property of the Vault key becomes a key of the Secret (dataFrom.extract).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: allocator-github-token
  namespace: ssot-tools
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-ssot-tools
    kind: SecretStore
  target:
    name: allocator-github-token
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: ssot-tools/allocator-github-token
