# Namespaced SecretStore, scoped to what the ssot-tools Vault role/policy grants
# (secret/data/ssot-tools/*). See infrastructure/external-secrets/.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-ssot-tools
  namespace: ssot-tools
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: ssot-tools
          serviceAccountRef:
            name: eso-ssot-tools
