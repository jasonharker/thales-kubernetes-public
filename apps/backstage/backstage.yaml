# Backstage. runAsUser 1000 is the image's `node` user: runAsNonRoot cannot verify a
# non-numeric USER. /tmp is the scaffolder's workspace, hence the emptyDir under a
# read-only root filesystem.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backstage
        app: backstage
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backstage
          image: 10.20.120.31:5000/backstage:cc19bf34 # backstage-image
          ports:
            - name: http
              containerPort: 7007
          envFrom:
            - secretRef:
                name: backstage-env
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: LDAP_BIND_DN
              value: CN=svc_linux_bind,OU=Service Accounts,OU=Users,OU=THALES,DC=thales,DC=internal
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/thales-ca/thales-root-ca.pem
          readinessProbe:
            httpGet:
              path: /.backstage/health/v1/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /.backstage/health/v1/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: thales-ca
              mountPath: /etc/thales-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: thales-ca
          configMap:
            name: thales-root-ca
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backstage
  namespace: backstage
  labels:
    app: backstage
spec:
  selector:
    app: backstage
  ports:
    - name: http
      port: 80
      targetPort: http
