# Flagger loadtester X.Y.Z, raw YAML from the upstream kustomize/tester manifest. It
# lives in this namespace rather than flagger-system so its curls to portfolio-canary are
# same-namespace traffic; the one cross-namespace edge is Flagger calling it on :8080.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flagger-loadtester
  namespace: portfolio-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flagger-loadtester
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flagger-loadtester
        app: flagger-loadtester
    spec:
      # No runAsNonRoot: the image's USER is the name `app`, not a UID, so the kubelet
      # cannot verify it and would refuse to start the container.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadtester
          image: ghcr.io/fluxcd/flagger-loadtester
          command:
            - ./loadtester
            - -port=8080
            - -log-level=info
            - -timeout=1h
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: flagger-loadtester
  namespace: portfolio-staging
spec:
  selector:
    app: flagger-loadtester
  ports:
    - name: http
      port: 80
      targetPort: http
