apiVersion: v1
kind: Service
metadata:
  annotations: {}
  name: mariadb
  namespace: lemp
spec:
  clusterIP: 10.111.248.114
  clusterIPs:
    - 10.111.248.114
  internalTrafficPolicy: Cluster
  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  ports:
    - port: 3306
      protocol: TCP
      targetPort: 3306
  selector:
    app: mariadb
  sessionAffinity: None
  type: ClusterIP
