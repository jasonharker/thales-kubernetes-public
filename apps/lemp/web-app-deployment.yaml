apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    secret.reloader.stakater.com/auto: "true"
  name: web-app
  namespace: lemp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-app
        app: web-app
    spec:
      initContainers:
        - name: copy-files
          image: 10.20.120.31:5000/dashboard
          command:
            - /bin/sh
            - -c
            - |
              echo "Copying files from image to shared volume..."
              cp -rv /var/www/html/* /shared/
              chown -R 82:82 /shared
              echo "Files copied successfully"
              ls -la /shared/public/
          volumeMounts:
            - mountPath: /shared
              name: shared-files
      containers:
        - name: nginx
          image: nginx
          ports:
            - containerPort: 80
          readinessProbe:
            tcpSocket:
              port: 80
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - mountPath: /var/www/html
              name: shared-files
            - mountPath: /etc/nginx/conf.d/default.conf
              name: nginx-config
              subPath: default.conf
        - name: php-fpm
          image: 10.20.120.31:5000/dashboard
          ports:
            - containerPort: 9000
          env:
            - name: DB_HOST
              value: mariadb
            - name: DB_NAME
              value: lemp_db
            - name: DB_USER
              value: lemp_user
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: user-password
            - name: TURNSTILE_SITEKEY
              value: 0x4AAAAAAD0ehNDv65Vzv5Dr
            - name: TURNSTILE_SECRET
              valueFrom:
                secretKeyRef:
                  name: turnstile-secret
                  key: TURNSTILE_SECRET
          readinessProbe:
            tcpSocket:
              port: 9000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 70m
              memory: 64Mi
          volumeMounts:
            - mountPath: /var/www/html
              name: shared-files
      volumes:
        - name: shared-files
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: nginx-config
