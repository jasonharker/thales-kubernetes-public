apiVersion: batch/v1
kind: CronJob
metadata:
  name: mariadb-backup
  namespace: lemp
spec:
  schedule: "50 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mariadb-backup
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/hostname: anaximander-w1
          containers:
          - name: mariadb-dump
            image: mariadb
            env:
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: root-password
            command: ["/bin/sh", "-c"]
            args:
            - |
              set -eu
              mariadb-dump -h mariadb -u root --databases lemp_db > /backups/lemp_db-$(date +%F).sql
              gzip -f /backups/lemp_db-$(date +%F).sql
              find /backups -name "*.sql.gz" -mtime +7 -delete
              ls -lh /backups
            volumeMounts:
            - name: backups
              mountPath: /backups
          volumes:
          - name: backups
            persistentVolumeClaim:
              claimName: db-backups-rbd
