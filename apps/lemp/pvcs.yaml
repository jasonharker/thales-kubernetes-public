apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-pvc-rbd
  namespace: lemp
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 3Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-backups-rbd
  namespace: lemp
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 1Gi
