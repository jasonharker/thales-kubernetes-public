# Namespaced SecretStore, scoped to what the lemp Vault role/policy grants
# (secret/data/lemp/*). See infrastructure/external-secrets/.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-lemp
  namespace: lemp
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: lemp
          serviceAccountRef:
            name: eso-lemp
