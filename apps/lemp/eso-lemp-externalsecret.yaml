# Replaces the SOPS secrets/ manifests. Target names and keys are unchanged; every
# property of the Vault key becomes a key of the Secret (dataFrom.extract).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb-secret
  namespace: lemp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-lemp
    kind: SecretStore
  target:
    name: mariadb-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: lemp/mariadb-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: turnstile-secret
  namespace: lemp
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-lemp
    kind: SecretStore
  target:
    name: turnstile-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: lemp/turnstile-secret
