apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc-rbd
  namespace: guacamole
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-backups-rbd
  namespace: guacamole
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 1Gi
