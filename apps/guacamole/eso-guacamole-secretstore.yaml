# Namespaced SecretStore, not a ClusterSecretStore — scopes this to what the
# guacamole Vault role/policy grants (secret/data/guacamole/*) and to this
# namespace's ExternalSecrets only. See infrastructure/external-secrets/.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-guacamole
  namespace: guacamole
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: guacamole
          serviceAccountRef:
            name: eso-guacamole
