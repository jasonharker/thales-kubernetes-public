apiVersion: v1
kind: ServiceAccount
metadata:
  name: guacd
  namespace: guacamole
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacd
  namespace: guacamole
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: guacd
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guacd
        app: guacd
    spec:
      containers:
      - image: guacamole/guacd
        imagePullPolicy: IfNotPresent
        name: guacd
        ports:
        - containerPort: 4822
          name: guacd
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: 4822
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        resources:
          requests:
            cpu: 100m
            memory: 80Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      hostNetwork: true
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      serviceAccountName: guacd
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: guacd
  namespace: guacamole
spec:
  ports:
  - name: guacd
    port: 4822
    protocol: TCP
    targetPort: 4822
  selector:
    app: guacd
  type: ClusterIP

