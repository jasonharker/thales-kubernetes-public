# Replaces secrets/postgres-secret.yaml (SOPS). Target name/keys are unchanged
# so postgres-deployment.yaml/guacamole.yaml/db-backup.yaml needed no edits —
# see THALES-SSOT for the migration.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-secret
  namespace: guacamole
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-guacamole
    kind: SecretStore
  target:
    name: postgres-secret
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_DB
      remoteRef:
        key: guacamole/postgres
        property: POSTGRES_DB
    - secretKey: POSTGRES_USER
      remoteRef:
        key: guacamole/postgres
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: guacamole/postgres
        property: POSTGRES_PASSWORD
