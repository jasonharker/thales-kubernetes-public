apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: guacamole
spec:
  schedule: "40 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-backup
        spec:
          restartPolicy: Never
          containers:
          - name: pg-dump
            image: postgres
            env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            command: ["/bin/sh", "-c"]
            args:
            - |
              set -eu
              pg_dump -Fc -Z6 -h postgres -U "$POSTGRES_USER" -f /backups/guacamole-$(date +%F).dump "$POSTGRES_DB"
              find /backups -name "*.dump" -mtime +7 -delete
              ls -lh /backups
            volumeMounts:
            - name: backups
              mountPath: /backups
          volumes:
          - name: backups
            persistentVolumeClaim:
              claimName: db-backups-rbd
