apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: n8n
  name: n8n
  namespace: n8n
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: n8n
  # Recreate, not RollingUpdate: this is a single replica on an RWO
  # ceph-rbd volume. A rolling update schedules the new pod before the old
  # one releases the disk, and if it lands on another node it deadlocks on
  # Multi-Attach forever. Costs a few seconds of downtime per rollout.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n
        app: n8n
    spec:
      containers:
      - env:
        - name: N8N_PROTOCOL
          value: http
        - name: N8N_PORT
          value: '5678'
        - name: WEBHOOK_URL
          value: http://n8n.n8n.svc.cluster.local:5678/
        - name: GENERIC_TIMEZONE
          value: America/Los_Angeles
        - name: N8N_LOG_LEVEL
          value: info
        - name: DB_TYPE
          value: sqlite
        - name: N8N_USER_FOLDER
          value: /home/node/.n8n
        - name: N8N_SECURE_COOKIE
          value: 'false'
        # Lets the alert-triage workflow call https://kubernetes.default.svc
        # with normal certificate verification, instead of an ignore-SSL
        # toggle on each HTTP node. This CA is already mounted into every pod
        # by default, so nothing new is projected in.
        - name: NODE_EXTRA_CA_CERTS
          value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        # weekly-audit's cert-expiry leg needs require(tls) in its
        # Code node; n8n blocks Node builtins in the sandbox by default.
        - name: NODE_FUNCTION_ALLOW_BUILTIN
          value: tls
        image: n8nio/n8n
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 5678
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 5
        name: n8n
        ports:
        - containerPort: 5678
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 5678
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 1536Mi
          requests:
            cpu: 100m
            memory: 256Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /home/node/.n8n
          name: n8n-data
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: n8n-data
        persistentVolumeClaim:
          claimName: n8n-data-rbd
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: n8n
  name: n8n
  namespace: n8n
spec:
  externalTrafficPolicy: Cluster
  ports:
  - name: http
    nodePort: 30678
    port: 5678
    protocol: TCP
    targetPort: 5678
  selector:
    app: n8n
  type: NodePort

