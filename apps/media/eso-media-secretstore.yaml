# Namespaced SecretStore, scoped to what the media Vault role/policy grants
# (secret/data/media/*). See infrastructure/external-secrets/.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault-media
  namespace: media
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: media
          serviceAccountRef:
            name: eso-media
