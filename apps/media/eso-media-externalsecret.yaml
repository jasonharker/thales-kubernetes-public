# Replaces the SOPS secrets/ manifests. Target names and keys are unchanged; every
# property of the Vault key becomes a key of the Secret (dataFrom.extract).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: navidrome-lastfm
  namespace: media
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-media
    kind: SecretStore
  target:
    name: navidrome-lastfm
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: media/navidrome-lastfm
