# Tests for the tenant merge gate. Any change to .github/scripts/ must keep these green.
name: validator-tests

on:
  pull_request:
    paths: [".github/scripts/**"]
  push:
    branches: [main]
    paths: [".github/scripts/**"]

jobs:
  pytest:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest==X.Y.Z pyyaml==X.Y.Z
      - run: python -m pytest -q .github/scripts
